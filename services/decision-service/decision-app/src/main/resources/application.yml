spring:
  application:
    name: decision-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8083}
  shutdown: graceful

nba:
  decision:
    # Unique per replica so each replica consumes every change event (Kubernetes sets HOSTNAME to the pod name).
    instance-id: ${HOSTNAME:local}
    deadline: 80ms
    default-max-items: 3
    max-items-limit: 20
    max-concurrent-per-channel: 256
    circuit-breaker:
      failure-rate-threshold: 50
      slow-call-rate-threshold: 80
      minimum-number-of-calls: 20
      wait-in-open-state: 10s
    safe-defaults:
      default: []
    plugins:
      propensity-scoring:
        # Used for actions without a model, and for any model that cannot be scored.
        default-propensity: 0.05
        # Budget for all remote model calls of one decision (they run in parallel).
        timeout: 40ms
        # prior: fall back per action and keep deciding. safe-default: return the safe default answer instead.
        on-failure: prior
      remote-model:
        # Open Inference Protocol (KServe v2) model server for offerings whose model type is "remote".
        enabled: ${NBA_MODEL_SERVER_ENABLED:false}
        base-url: ${NBA_MODEL_SERVER_URL:http://localhost:8085}
        timeout: 30ms
        circuit-breaker:
          failure-rate-threshold: 50
          minimum-number-of-calls: 20
          wait-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
