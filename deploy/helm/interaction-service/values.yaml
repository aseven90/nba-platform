image:
  repository: ghcr.io/aseven90/nba-platform/interaction-service
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 2
containerPort: 8080
terminationGracePeriodSeconds: 30

env:
  KAFKA_BOOTSTRAP_SERVERS: nba-kafka-bootstrap:9092
  TRACING_SAMPLING: "0.1"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  DB_URL: jdbc:postgresql://nba-postgres:5432/interaction

# Secret providing DB_USER and DB_PASSWORD (for example from External Secrets Operator).
envFromSecret: interaction-service-db

resources:
  requests:
    cpu: "500m"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  # Additional autoscaling/v2 metrics, for example requests per second from a metrics adapter.
  extraMetrics: []

pdb:
  enabled: true
  minAvailable: 1

securityContext:
  runAsUser: 10001

# Service mesh is optional: add istio.io/dataplane-mode or linkerd.io/inject here, see docs/deployment.md.
podAnnotations: {}

topologySpread:
  enabled: true
nodeSelector: {}
tolerations: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

openshift:
  enabled: false
  route:
    enabled: false
    host: ""

serviceMonitor:
  enabled: false
