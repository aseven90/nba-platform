# Local stack: PostgreSQL, a Kafka-API broker (Redpanda) and the four services.
#   docker compose -f deploy/compose/docker-compose.yml up --build
name: nba-platform

x-service: &service
  build:
    context: ../..
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    topics: { condition: service_completed_successfully }

x-env: &env
  PORT: "8080"
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  DB_USER: nba
  DB_PASSWORD: nba
  TRACING_SAMPLING: "0"

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba"]
      interval: 5s
      retries: 20
    ports: ["5432:5432"]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --mode dev-container --smp 1 --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20
    ports: ["19092:19092"]

  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk -X brokers=redpanda:9092 topic create nba.catalog.offering.changed nba.campaign.changed -p 6 -c cleanup.policy=compact || true
        rpk -X brokers=redpanda:9092 topic create nba.decision.made nba.interaction.recorded -p 6 -c retention.ms=2592000000 || true

  action-catalog-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/action-catalog-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
    ports: ["8081:8080"]

  campaign-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/campaign-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/campaign
    ports: ["8082:8080"]

  decision-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/decision-service/decision-app } }
    environment:
      <<: *env
    ports: ["8083:8080"]

  interaction-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/interaction-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/interaction
    ports: ["8084:8080"]
