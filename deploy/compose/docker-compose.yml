# Local stack: PostgreSQL, a Kafka-API broker (Redpanda), the four services and the console (http://localhost:3000).
#   docker compose -f deploy/compose/docker-compose.yml up --build
# Host ports can be changed if they clash with something already running, e.g.
#   CONSOLE_PORT=8090 docker compose -f deploy/compose/docker-compose.yml up --build
# Variables (default): CONSOLE_PORT (3000), CATALOG_PORT (8081), CAMPAIGN_PORT (8082), DECISION_PORT (8083),
#   INTERACTION_PORT (8084), POSTGRES_PORT (5432), KAFKA_PORT (19092). They can also go in deploy/compose/.env.
name: nba-platform

x-service: &service
  build:
    context: ../..
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    topics: { condition: service_completed_successfully }

x-env: &env
  PORT: "8080"
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  DB_USER: nba
  DB_PASSWORD: nba
  TRACING_SAMPLING: "0"

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba"]
      interval: 5s
      retries: 20
    ports: ["${POSTGRES_PORT:-5432}:5432"]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --mode dev-container --smp 1 --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20
    ports: ["${KAFKA_PORT:-19092}:19092"]

  topics:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk -X brokers=redpanda:9092 topic create nba.catalog.offering.changed nba.campaign.changed -p 6 -c cleanup.policy=compact || true
        rpk -X brokers=redpanda:9092 topic create nba.decision.made nba.interaction.recorded -p 6 -c retention.ms=2592000000 || true

  action-catalog-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/action-catalog-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
    ports: ["${CATALOG_PORT:-8081}:8080"]

  campaign-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/campaign-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/campaign
    ports: ["${CAMPAIGN_PORT:-8082}:8080"]

  decision-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/decision-service/decision-app } }
    environment:
      <<: *env
    ports: ["${DECISION_PORT:-8083}:8080"]

  interaction-service:
    <<: *service
    build: { context: ../.., args: { MODULE: services/interaction-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/interaction
    ports: ["${INTERACTION_PORT:-8084}:8080"]

  console:
    build: { context: ../../ui/console }
    restart: unless-stopped
    depends_on:
      - action-catalog-service
      - campaign-service
      - decision-service
      - interaction-service
    environment:
      CATALOG_URL: http://action-catalog-service:8080
      CAMPAIGN_URL: http://campaign-service:8080
      DECISION_URL: http://decision-service:8080
      INTERACTION_URL: http://interaction-service:8080
    ports: ["${CONSOLE_PORT:-3000}:8080"]
