openapi: 3.1.0
info:
  title: NBA platform shared components
  version: 0.1.0
  description: Components shared by all NBA platform APIs (TMF630 conventions).
paths: {}
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant the request acts for. Every resource and event is scoped to one tenant.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
  headers:
    X-Total-Count:
      schema: { type: integer }
    X-Result-Count:
      schema: { type: integer }
  schemas:
    TimePeriod:
      type: object
      properties:
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
    Ref:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        '@referredType': { type: string }
    Error:
      type: object
      required: [code, reason]
      properties:
        code: { type: string }
        reason: { type: string }
        message: { type: string }
        status: { type: string }
        '@type': { type: string, const: Error }
  responses:
    Error:
      description: TMF630 error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
